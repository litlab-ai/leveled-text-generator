<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leveled text generator</title>
    <style>
      :root {
        --bg: #fafaf7;
        --fg: #1f2328;
        --muted: #6b7280;
        --border: #e5e5e0;
        --accent: #2f6f4e;
        --easy: #2f6f4e;
        --medium: #9a6700;
        --hard: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; }
      h2 { font-size: 1rem; margin: 28px 0 8px; }
      p.lede { color: var(--muted); margin: 0 0 24px; }
      .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      select, button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
      }
      button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: progress; }
      .words { display: flex; flex-wrap: wrap; gap: 8px; }
      .word {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
        user-select: none;
      }
      .word input { margin: 0; }
      .tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
      .tag.easy { color: var(--easy); }
      .tag.medium { color: var(--medium); }
      .tag.hard { color: var(--hard); }
      .passage {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        font-size: 1.1rem;
        line-height: 1.7;
        white-space: pre-wrap;
      }
      .check { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .check div { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
      .check h3 { font-size: 0.85rem; margin: 0 0 6px; color: var(--muted); }
      .error { color: var(--hard); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Leveled text generator</h1>
      <p class="lede">Pick a reading level and the words to practice, then generate a short passage.</p>

      <div class="controls">
        <label>
          Level
          <select id="level">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button id="generate" type="button">Generate passage</button>
      </div>

      <h2>Words</h2>
      <div id="words" class="words"></div>

      <p id="error" class="error" hidden></p>

      <section id="result" hidden>
        <h2>Passage</h2>
        <div id="passage" class="passage"></div>

        <h2>Required words check</h2>
        <div class="check">
          <div><h3>Found</h3><span id="found"></span></div>
          <div><h3>Missing</h3><span id="missing"></span></div>
        </div>
      </section>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);

      async function loadWords() {
        const res = await fetch("/api/words");
        const words = await res.json();
        $("words").replaceChildren(
          ...words.map((word) => {
            const label = document.createElement("label");
            label.className = "word";
            label.innerHTML = `<input type="checkbox" checked value="${word.text}" />
              <span>${word.text}</span>
              <span class="tag ${word.level}">${word.level}</span>`;
            return label;
          }),
        );
      }

      async function generate() {
        const button = $("generate");
        button.disabled = true;
        button.textContent = "Generating…";
        $("error").hidden = true;

        try {
          const words = [...document.querySelectorAll("#words input:checked")].map((el) => el.value);
          const res = await fetch("/api/generate", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ level: $("level").value, words }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error ?? "Request failed");

          $("passage").textContent = data.passage;
          $("found").textContent = data.found.join(", ") || "—";
          $("missing").textContent = data.missing.join(", ") || "—";
          $("result").hidden = false;
        } catch (err) {
          $("error").textContent = err.message;
          $("error").hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = "Generate passage";
        }
      }

      $("generate").addEventListener("click", generate);
      loadWords();
    </script>
  </body>
</html>
